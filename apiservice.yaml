from typing import Any, Dict, List, Optional
from datetime import datetime
from pydantic import BaseModel
from .base import Pagination


class ToolCall(BaseModel):
    name: str
    durationMs: int
    status: str
    request: Optional[str] = None
    response: Optional[str] = None


class PIIFlags(BaseModel):
    piiDetected: Optional[bool] = False
    piiTypes: Optional[List[str]] = None
    redactionApplied: Optional[bool] = False
    redactionStrategy: Optional[str] = None


class CostRecord(BaseModel):
    traceId: Optional[str] = None
    spanId: Optional[str] = None
    agentId: Optional[str] = None
    team: Optional[str] = None
    platform: Optional[str] = None
    provider: Optional[str] = None
    model: Optional[str] = None
    inputTokens: Optional[int] = None
    outputTokens: Optional[int] = None
    amountUsd: float
    currency: str = "USD"
    timestamp: datetime


class CostSummaryBucket(BaseModel):
    key: str
    amountUsd: float
    executions: int


class CostSummary(BaseModel):
    groupBy: Optional[str] = None
    from_: Optional[datetime] = None
    to: Optional[datetime] = None
    totals: List[CostSummaryBucket] = []


class AgentExecution(BaseModel):
    id: str
    platform: str
    tenantId: Optional[str]
    timestamp: datetime
    # simplified; add full fields as needed
    agent: Dict[str, Any]
    execution: Dict[str, Any]
    llm: Optional[Dict[str, Any]]
    io: Optional[Dict[str, Any]]
    context: Dict[str, Any]
    toolsCalled: Optional[List[ToolCall]] = None


class Agent(BaseModel):
    id: str
    name: str
    description: Optional[str] = None
    platform: str
    environment: str = "production"
    team: Optional[str] = None
    version: Optional[str] = None
    runtimeType: str = "external"
    telemetryBadge: str = "external"
    createdAt: datetime
    updatedAt: datetime


class Span(BaseModel):
    spanId: str
    traceId: str
    parentSpanId: Optional[str] = None
    name: str
    serviceName: Optional[str] = None
    kind: Optional[str] = None
    attributes: Optional[Dict[str, str]] = None
    startTime: datetime
    endTime: datetime
    status: Optional[str] = None
    statusMessage: Optional[str] = None
    toolCalls: Optional[List[ToolCall]] = None
    piiFlags: Optional[PIIFlags] = None


class Edge(BaseModel):
    id: str
    fromSpanId: str
    toSpanId: str
    type: str
    metadata: Optional[Dict[str, str]] = None


class Trace(BaseModel):
    traceId: str
    rootSpanId: Optional[str] = None
    spans: List[Span]
    edges: Optional[List[Edge]] = None
    cost: Optional[CostRecord] = None
    piiFlags: Optional[PIIFlags] = None
    createdAt: datetime

