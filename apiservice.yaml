FastAPI Service Stubs — Based on OpenAPI

This is a minimal but complete skeleton mirroring your OpenAPI groups:

main.py for app wiring and router registration

models for Pydantic equivalents of schemas (only key ones; you can extend)

routers for each tag

You can generate full OpenAPI from this app, or keep your hand-written YAML as the contract.

3.1 backend/app/main.py
# backend/app/main.py
from fastapi import FastAPI
from .routers import (
    runtime,
    agents,
    ingest,
    traces,
    replay,
    cost,
    alerts,
    tenants,
    policies,
    connectors,
    health,
)

app = FastAPI(
    title="AgentOS / AgentFlow Unified API",
    version="1.0.0",
)

# Routers
app.include_router(runtime.router, prefix="/v1/runtime", tags=["Runtime"])
app.include_router(agents.router, prefix="/v1/agents", tags=["Agents"])
app.include_router(ingest.router, prefix="/v1/telemetry", tags=["Ingest"])
app.include_router(traces.router, prefix="/v1", tags=["Traces"])  # /traces, /spans, /edges
app.include_router(replay.router, prefix="/v1/replay", tags=["Replay"])
app.include_router(cost.router, prefix="/v1/cost", tags=["Cost"])
app.include_router(alerts.router, prefix="/v1/alerts", tags=["Alerts"])
app.include_router(tenants.router, prefix="/v1/tenants", tags=["Tenants"])
app.include_router(policies.router, prefix="/v1/policies", tags=["Policies"])
app.include_router(connectors.router, prefix="/v1/connectors", tags=["Connectors"])
app.include_router(health.router, prefix="/v1/health", tags=["Health"])

