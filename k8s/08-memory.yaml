apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory
  namespace: agentos
  labels:
    app: memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory
  template:
    metadata:
      labels:
        app: memory
    spec:
      containers:
      - name: memory
        image: agentos/memory:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentos-secrets
              key: DATABASE_URL
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: agentos-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memory
  namespace: agentos
  labels:
    app: memory
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: memory
