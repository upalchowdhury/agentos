apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: agentos
data:
  001_initial_schema.sql: |
    -- Agent Economy OS Database Schema
    -- Version: 0.1.0
    
    CREATE TABLE IF NOT EXISTS dids (
        id TEXT PRIMARY KEY,
        document JSONB NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS credentials (
        id SERIAL PRIMARY KEY,
        subject_did TEXT NOT NULL,
        issuer_did TEXT NOT NULL DEFAULT 'did:agent:system',
        credential_jwt TEXT NOT NULL,
        issued_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        expires_at TIMESTAMP WITH TIME ZONE,
        revoked BOOLEAN DEFAULT FALSE,
        revoked_at TIMESTAMP WITH TIME ZONE,
        FOREIGN KEY (subject_did) REFERENCES dids(id) ON DELETE CASCADE
    );
    
    CREATE TABLE IF NOT EXISTS memories (
        id SERIAL PRIMARY KEY,
        agent_did TEXT NOT NULL,
        conversation_id TEXT NOT NULL,
        content TEXT NOT NULL,
        metadata JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        FOREIGN KEY (agent_did) REFERENCES dids(id) ON DELETE CASCADE
    );
    
    CREATE TABLE IF NOT EXISTS interactions (
        id SERIAL PRIMARY KEY,
        caller_did TEXT NOT NULL,
        target_did TEXT NOT NULL,
        conversation_id TEXT,
        request JSONB NOT NULL,
        response JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        FOREIGN KEY (caller_did) REFERENCES dids(id) ON DELETE CASCADE,
        FOREIGN KEY (target_did) REFERENCES dids(id) ON DELETE CASCADE
    );
    
    CREATE TABLE IF NOT EXISTS tenant_access (
        id SERIAL PRIMARY KEY,
        agent_did TEXT NOT NULL,
        resource_type TEXT NOT NULL,
        resource_id TEXT NOT NULL,
        access_level TEXT NOT NULL,
        granted_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        expires_at TIMESTAMP WITH TIME ZONE,
        FOREIGN KEY (agent_did) REFERENCES dids(id) ON DELETE CASCADE
    );
    
    CREATE TABLE IF NOT EXISTS cost_events (
        id SERIAL PRIMARY KEY,
        agent_did TEXT NOT NULL,
        cost_cents INTEGER NOT NULL,
        description TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        FOREIGN KEY (agent_did) REFERENCES dids(id) ON DELETE CASCADE
    );

  002_add_indexes.sql: |
    -- Performance indexes
    CREATE INDEX IF NOT EXISTS idx_dids_created_at ON dids(created_at);
    CREATE INDEX IF NOT EXISTS idx_credentials_subject_did ON credentials(subject_did);
    CREATE INDEX IF NOT EXISTS idx_credentials_issued_at ON credentials(issued_at);
    CREATE INDEX IF NOT EXISTS idx_credentials_revoked ON credentials(revoked) WHERE revoked = TRUE;
    CREATE INDEX IF NOT EXISTS idx_memories_agent_did ON memories(agent_did);
    CREATE INDEX IF NOT EXISTS idx_memories_conversation_id ON memories(conversation_id);
    CREATE INDEX IF NOT EXISTS idx_memories_created_at ON memories(created_at);
    CREATE INDEX IF NOT EXISTS idx_interactions_caller_did ON interactions(caller_did);
    CREATE INDEX IF NOT EXISTS idx_interactions_target_did ON interactions(target_did);
    CREATE INDEX IF NOT EXISTS idx_interactions_conversation_id ON interactions(conversation_id);
    CREATE INDEX IF NOT EXISTS idx_interactions_created_at ON interactions(created_at);
    CREATE INDEX IF NOT EXISTS idx_tenant_access_agent_did ON tenant_access(agent_did);
    CREATE INDEX IF NOT EXISTS idx_cost_events_agent_did ON cost_events(agent_did);
    CREATE INDEX IF NOT EXISTS idx_cost_events_created_at ON cost_events(created_at);
