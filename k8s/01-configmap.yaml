apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-config
  namespace: agentos
data:
  ENVIRONMENT: "local"
  LOG_LEVEL: "info"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "agentos"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  IDENTITY_SERVICE_URL: "http://identity:3000"
  MEMORY_SERVICE_URL: "http://memory:8000"
  POLICY_SERVICE_URL: "http://policy-engine:8081"
  GATEWAY_SERVICE_URL: "http://gateway:8080"
