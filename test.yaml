Nice, let’s wrap a test harness around this thing. I’ll give you ready-to-drop-in scaffolding for:

pytest (API tests using FastAPI’s TestClient)

Playwright (API-level checks via Playwright’s request context, and room to grow into UI tests)

I’ll assume your repo is roughly:

backend/
  app/
    main.py
    routers/
    models/
tests/


You can adjust paths as needed.

1. Pytest scaffolding for the FastAPI APIs
1.1 tests/pyproject.toml or pytest.ini

Use either. Here’s a minimal pytest.ini:

# pytest.ini
[pytest]
minversion = 7.0
addopts = -ra -q
testpaths = tests
python_files = test_*.py
asyncio_mode = auto

1.2 tests/conftest.py

Creates a reusable client fixture using FastAPI’s TestClient.

# tests/conftest.py
import os
import pytest
from fastapi.testclient import TestClient

# Ensure we import the app from backend.app.main
# Adjust this import if your path is different.
from backend.app.main import app


@pytest.fixture(scope="session")
def test_settings():
    """
    Hook for test-specific settings (DB URL, Kafka mocks, etc.).
    Right now it's just a placeholder.
    """
    return {
        "ENV": "test",
        # You can put TEST_DATABASE_URL etc. here later.
    }


@pytest.fixture(scope="session")
def client(test_settings):
    """
    Shared TestClient for sync HTTP tests.
    For async tests, you can use httpx.AsyncClient+lifespan manager instead.
    """
    # You can override dependencies here if you add Depends() later.
    with TestClient(app) as c:
        yield c

1.3 Health checks: tests/test_health.py
# tests/test_health.py

def test_health_liveness(client):
    resp = client.get("/v1/health")
    assert resp.status_code == 200
    data = resp.json()
    assert data["status"] == "ok"


def test_health_readiness(client):
    resp = client.get("/v1/health/ready")
    assert resp.status_code in (200, 503)
    data = resp.json()
    assert "status" in data

1.4 Runtime API tests: tests/test_runtime.py

These hit the stubbed runtime endpoints we defined.

# tests/test_runtime.py
from uuid import uuid4


def test_deploy_agent_minimal(client):
    payload = {
        "name": "test-agent",
        "sourceUrl": "https://github.com/example/agent-repo",
    }
    resp = client.post("/v1/runtime/deploy", json=payload)
    assert resp.status_code == 201
    body = resp.json()
    assert "agentId" in body
    assert "versionId" in body
    assert body["status"] in ["deploying", "active"]


def test_rollback_agent_basic(client):
    payload = {
        "agentId": "agent-123"
    }
    resp = client.post("/v1/runtime/rollback", json=payload)
    assert resp.status_code == 200
    body = resp.json()
    assert body["agentId"] == payload["agentId"]
    assert "versionId" in body
    assert body["status"] == "active"


def test_invoke_agent_happy_path(client):
    agent_id = "agent-123"
    payload = {
        "input": "Hello!",
        "context": {"user": "test-user"},
    }
    resp = client.post(f"/v1/runtime/invoke/{agent_id}", json=payload)
    assert resp.status_code in (200, 202)
    data = resp.json()
    assert "traceId" in data
    # For 200 we expect an output
    if resp.status_code == 200:
        assert "output" in data

1.5 Ingest API tests: tests/test_ingest.py
# tests/test_ingest.py
from datetime import datetime, timezone
from uuid import uuid4


def make_agent_execution():
    now = datetime.now(timezone.utc).isoformat()
    return {
        "id": str(uuid4()),
        "platform": "langchain",
        "tenantId": "tenant-123",
        "timestamp": now,
        "agent": {
            "id": "agent-123",
            "name": "LangChain Agent",
            "version": "v1",
            "type": "conversational",
        },
        "execution": {
            "traceId": f"trace-{uuid4()}",
            "spanId": f"span-{uuid4()}",
            "parentSpanId": None,
            "durationMs": 1234,
            "status": "success",
        },
        "llm": {
            "provider": "openai",
            "model": "gpt-4",
            "inputTokens": 100,
            "outputTokens": 50,
            "totalCostUsd": 0.01,
        },
        "io": {
            "input": "sanitized input",
            "output": "sanitized output",
            "piiDetected": False,
            "piiTypes": [],
        },
        "context": {
            "userId": "user-xyz",
            "sessionId": str(uuid4()),
            "environment": "production",
            "team": "support",
            "tags": {"customer_tier": "enterprise"},
        },
        "toolsCalled": [
            {
                "name": "db_query",
                "durationMs": 50,
                "status": "success",
            }
        ],
    }


def test_ingest_single_event(client):
    payload = {"events": [make_agent_execution()]}
    resp = client.post("/v1/telemetry/events", json=payload)
    assert resp.status_code == 200 or resp.status_code == 202
    body = resp.json()
    assert body["accepted"] == 1
    assert body["rejected"] == 0


def test_ingest_multiple_events(client):
    payload = {"events": [make_agent_execution() for _ in range(3)]}
    resp = client.post("/v1/telemetry/events", json=payload)
    assert resp.status_code in (200, 202)
    body = resp.json()
    assert body["accepted"] == 3
    assert body["rejected"] == 0

