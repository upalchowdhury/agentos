2. Playwright scaffolding

Even if the UI isn’t built yet, we can use Playwright’s APIRequestContext to run API-focused integration tests that:

Hit the real running FastAPI server (e.g., on http://localhost:8000)

Validate end-to-end behavior (no TestClient, real network stack)

Later, when you add a React UI, you can extend these with real page interactions.

2.1 Install Playwright

From repo root (or in a tests/e2e folder):

npm init -y
npm install -D @playwright/test
npx playwright install

2.2 playwright.config.ts

Place in repo root or tests/e2e/playwright.config.ts (if in subfolder, adjust paths):

// playwright.config.ts
import { defineConfig, devices } from '@playwright/test';

export default defineConfig({
  testDir: './tests/e2e',
  timeout: 30_000,
  expect: {
    timeout: 5_000,
  },
  use: {
    // Point this to where your FastAPI app runs in dev/test
    baseURL: process.env.BASE_URL || 'http://localhost:8000',
  },
  projects: [
    {
      name: 'chromium',
      use: { ...devices['Desktop Chrome'] },
    },
  ],
});

2.3 API smoke tests with Playwright: tests/e2e/health.spec.ts
// tests/e2e/health.spec.ts
import { test, expect } from '@playwright/test';

test.describe('API health endpoints', () => {
  test('liveness returns ok', async ({ request, baseURL }) => {
    const res = await request.get(`${baseURL}/v1/health`);
    expect(res.status()).toBe(200);
    const body = await res.json();
    expect(body.status).toBe('ok');
  });

  test('readiness returns ready or error', async ({ request, baseURL }) => {
    const res = await request.get(`${baseURL}/v1/health/ready`);
    expect([200, 503]).toContain(res.status());
  });
});

2.4 Runtime E2E: tests/e2e/runtime.spec.ts
// tests/e2e/runtime.spec.ts
import { test, expect } from '@playwright/test';

test.describe('Runtime API (E2E via HTTP)', () => {
  test('deploy -> invoke flow (stub)', async ({ request, baseURL }) => {
    // Deploy
    const deployResp = await request.post(`${baseURL}/v1/runtime/deploy`, {
      data: {
        name: 'playwright-test-agent',
        sourceUrl: 'https://github.com/example/agent-repo',
      },
    });
    expect(deployResp.status()).toBe(201);
    const deployBody = await deployResp.json();
    expect(deployBody.agentId).toBeTruthy();

    // Invoke
    const invokeResp = await request.post(
      `${baseURL}/v1/runtime/invoke/${deployBody.agentId}`,
      {
        data: {
          input: 'Hello from Playwright',
          context: { user: 'playwright' },
        },
      }
    );
    expect([200, 202]).toContain(invokeResp.status());
    const invokeBody = await invokeResp.json();
    expect(invokeBody.traceId).toBeTruthy();
  });
});

2.5 Ingest & trace E2E: tests/e2e/observability.spec.ts
// tests/e2e/observability.spec.ts
import { test, expect } from '@playwright/test';

function makeAgentExecution() {
  const now = new Date().toISOString();
  const id = crypto.randomUUID();
  const traceId = `trace-${crypto.randomUUID()}`;
  const spanId = `span-${crypto.randomUUID()}`;

  return {
    id,
    platform: 'langchain',
    tenantId: 'tenant-123',
    timestamp: now,
    agent: {
      id: 'agent-123',
      name: 'Playwright Agent',
      version: 'v1',
      type: 'conversational',
    },
    execution: {
      traceId,
      spanId,
      parentSpanId: null,
      durationMs: 1000,
      status: 'success',
    },
    llm: {
      provider: 'openai',
      model: 'gpt-4',
      inputTokens: 10,
      outputTokens: 5,
      totalCostUsd: 0.01,
    },
    io: {
      input: 'hello',
      output: 'world',
      piiDetected: false,
      piiTypes: [],
    },
    context: {
      userId: 'user-123',
      sessionId: crypto.randomUUID(),
      environment: 'production',
      team: 'playwright-tests',
      tags: {
        customer_tier: 'enterprise',
      },
    },
    toolsCalled: [],
  };
}

test.describe('Observability pipeline', () => {
  test('ingest event and later search trace (eventual)', async ({ request, baseURL }) => {
    const event = makeAgentExecution();

    // Ingest
    const ingestRes = await request.post(`${baseURL}/v1/telemetry/events`, {
      data: { events: [event] },
    });
    expect([200, 202]).toContain(ingestRes.status());

    // NOTE: In a real system you might need to wait for processing;
    // here we just call search with the same traceId for sanity.
    const searchRes = await request.post(`${baseURL}/v1/traces/search`, {
      data: {
        query: event.execution.traceId,
        filters: {
          platform: event.platform,
        },
        limit: 10,
      },
    });

    expect(searchRes.status()).toBe(200);
    const searchBody = await searchRes.json();
    expect(searchBody).toHaveProperty('data');
  });
});


If TypeScript complains about crypto.randomUUID() in Node, you can polyfill with a simple UUID helper or import { randomUUID } from 'crypto';.

2.6 (Optional) UI test skeleton

When you add a React UI (say served at /), you can do:

// tests/e2e/ui-smoke.spec.ts
import { test, expect } from '@playwright/test';

test('home page loads and hits health API', async ({ page }) => {
  await page.goto('/');
  // Example: check that some health indicator appears
  await expect(page.getByTestId('health-status')).toBeVisible();
});

3. How to run everything

Pytest:

# from repo root (where pytest.ini lives)
pytest


Playwright:

# Ensure FastAPI app is running, e.g.:
uvicorn backend.app.main:app --reload --port 8000

# Then run Playwright:
npx playwright test
# or with BASE_URL override:
BASE_URL=http://localhost:8001 npx playwright test
