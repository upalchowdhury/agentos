            port: 8002
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: app-code
        hostPath:
          path: /Users/upalc/AgentOS/agentos
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: otel-bridge
  namespace: agentos
spec:
  selector:
    app: otel-bridge
  ports:
