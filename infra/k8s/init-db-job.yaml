# Database initialization job
# Applies schema migrations after PostgreSQL is ready

apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
  namespace: agentos
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 5; done; sleep 10']
      containers:
      - name: init-db
        image: postgres:16
        command: ["/bin/bash", "-c"]
        args:
          - |
            cat <<'EOF' > /tmp/schema.sql
            -- Enhanced Runtime Schema from 005_enhanced_runtime_schema.sql
            
            -- Agents table
            CREATE TABLE IF NOT EXISTS agents (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                name VARCHAR(255) NOT NULL,
                owner_id VARCHAR(255) NOT NULL,
                model_type VARCHAR(50) NOT NULL CHECK (model_type IN ('A', 'B')),
                runtime VARCHAR(50),
                status VARCHAR(50) DEFAULT 'PENDING',
                health_status VARCHAR(50),
                deployed_at TIMESTAMPTZ,
                created_at TIMESTAMPTZ DEFAULT NOW(),
                metadata JSONB DEFAULT '{}'::jsonb
            );
            
            CREATE INDEX IF NOT EXISTS idx_agents_owner ON agents(owner_id);
            CREATE INDEX IF NOT EXISTS idx_agents_status ON agents(status);
            
            -- Agent versions table
            CREATE TABLE IF NOT EXISTS agent_versions (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                agent_id UUID REFERENCES agents(id) ON DELETE CASCADE,
                version_number INTEGER NOT NULL,
                artifact_uri TEXT,
                requirements_json JSONB,
                created_at TIMESTAMPTZ DEFAULT NOW(),
                UNIQUE(agent_id, version_number)
            );
            
            -- Invocations table
            CREATE TABLE IF NOT EXISTS invocations (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                agent_id UUID REFERENCES agents(id) ON DELETE CASCADE,
                version_id UUID REFERENCES agent_versions(id),
                requester_id VARCHAR(255) NOT NULL,
                status VARCHAR(50) NOT NULL,
                started_at TIMESTAMPTZ DEFAULT NOW(),
                ended_at TIMESTAMPTZ,
                execution_time_ms INTEGER,
                cost_decimal DECIMAL(12, 6),
                cost_breakdown JSONB,
                input_data JSONB,
                output_data JSONB,
                error_message TEXT,
                metadata JSONB DEFAULT '{}'::jsonb
            );
            
            CREATE INDEX IF NOT EXISTS idx_invocations_agent ON invocations(agent_id);
            CREATE INDEX IF NOT EXISTS idx_invocations_started ON invocations(started_at DESC);
            CREATE INDEX IF NOT EXISTS idx_invocations_status ON invocations(status);
            CREATE INDEX IF NOT EXISTS idx_invocations_trace_id ON invocations((metadata->>'trace_id'));
            
            -- Cost snapshots table
            CREATE TABLE IF NOT EXISTS cost_snapshots (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                agent_id UUID REFERENCES agents(id) ON DELETE CASCADE,
                owner_id VARCHAR(255) NOT NULL,
                period_start TIMESTAMPTZ NOT NULL,
                period_end TIMESTAMPTZ NOT NULL,
                total_invocations INTEGER DEFAULT 0,
                successful_invocations INTEGER DEFAULT 0,
                failed_invocations INTEGER DEFAULT 0,
                total_cost DECIMAL(12, 6) DEFAULT 0,
                compute_cost DECIMAL(12, 6) DEFAULT 0,
                llm_api_cost DECIMAL(12, 6) DEFAULT 0,
                created_at TIMESTAMPTZ DEFAULT NOW(),
                UNIQUE(agent_id, period_start)
            );
            
            CREATE INDEX IF NOT EXISTS idx_cost_snapshots_period ON cost_snapshots(period_start);
            CREATE INDEX IF NOT EXISTS idx_cost_snapshots_agent ON cost_snapshots(agent_id);
            
            -- Agent tokens for A2A auth
            CREATE TABLE IF NOT EXISTS agent_tokens (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                agent_id UUID REFERENCES agents(id) ON DELETE CASCADE,
                token_hash VARCHAR(255) NOT NULL UNIQUE,
                public_key TEXT,
                created_at TIMESTAMPTZ DEFAULT NOW(),
                expires_at TIMESTAMPTZ,
                revoked BOOLEAN DEFAULT FALSE
            );
            
            CREATE INDEX IF NOT EXISTS idx_agent_tokens_hash ON agent_tokens(token_hash);
            
            -- Alerts table
            CREATE TABLE IF NOT EXISTS alerts (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                type VARCHAR(100) NOT NULL,
                severity VARCHAR(50) NOT NULL,
                agent_id UUID REFERENCES agents(id) ON DELETE CASCADE,
                version_id UUID REFERENCES agent_versions(id),
                context JSONB DEFAULT '{}'::jsonb,
                created_at TIMESTAMPTZ DEFAULT NOW()
            );
            
            CREATE INDEX IF NOT EXISTS idx_alerts_created ON alerts(created_at DESC);
            CREATE INDEX IF NOT EXISTS idx_alerts_agent ON alerts(agent_id);
            
            -- Agent stats view
            CREATE OR REPLACE VIEW agent_stats_v2 AS
            SELECT 
                a.id as agent_id,
                a.name,
                a.owner_id,
                a.status,
                a.health_status,
                COUNT(i.id) as total_invocations,
                COUNT(i.id) FILTER (WHERE i.status = 'SUCCESS') as successful_invocations,
                COUNT(i.id) FILTER (WHERE i.status = 'ERROR') as failed_invocations,
                AVG(i.execution_time_ms) as avg_execution_time_ms,
                PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY i.execution_time_ms) as p50_latency_ms,
                PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY i.execution_time_ms) as p95_latency_ms,
                PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY i.execution_time_ms) as p99_latency_ms,
                SUM(i.cost_decimal) as total_cost_usd,
                MAX(i.started_at) as last_invoked_at
            FROM agents a
            LEFT JOIN invocations i ON a.id = i.agent_id
            GROUP BY a.id, a.name, a.owner_id, a.status, a.health_status;
            
            -- A2A invocation graph view
            CREATE OR REPLACE VIEW a2a_invocation_graph AS
            SELECT 
                i.id as invocation_id,
                i.agent_id as caller_agent_id,
                i.metadata->>'target_did' as target_did,
                i.started_at,
                i.status,
                i.execution_time_ms,
                i.cost_decimal
            FROM invocations i
            WHERE i.metadata->>'protocol' = 'a2a';
            
            -- Function to aggregate daily costs
            CREATE OR REPLACE FUNCTION aggregate_daily_costs(target_date DATE)
            RETURNS VOID AS $$
            BEGIN
                INSERT INTO cost_snapshots (
                    agent_id, owner_id, period_start, period_end,
                    total_invocations, successful_invocations, failed_invocations,
                    total_cost, compute_cost, llm_api_cost
                )
                SELECT 
                    i.agent_id,
                    a.owner_id,
                    target_date::timestamp,
                    (target_date + INTERVAL '1 day')::timestamp,
                    COUNT(*),
                    COUNT(*) FILTER (WHERE i.status = 'SUCCESS'),
                    COUNT(*) FILTER (WHERE i.status = 'ERROR'),
                    COALESCE(SUM(i.cost_decimal), 0),
                    0, -- compute cost placeholder
                    COALESCE(SUM(i.cost_decimal), 0) -- assume all LLM for now
                FROM invocations i
                JOIN agents a ON i.agent_id = a.id
                WHERE DATE(i.started_at) = target_date
                GROUP BY i.agent_id, a.owner_id
                ON CONFLICT (agent_id, period_start) 
                DO UPDATE SET
                    total_invocations = EXCLUDED.total_invocations,
                    successful_invocations = EXCLUDED.successful_invocations,
                    failed_invocations = EXCLUDED.failed_invocations,
                    total_cost = EXCLUDED.total_cost,
                    llm_api_cost = EXCLUDED.llm_api_cost;
            END;
            $$ LANGUAGE plpgsql;
            
            EOF
            
            PGPASSWORD=$DATABASE_PASSWORD psql -h postgres -U postgres -d agentos -f /tmp/schema.sql
            echo "Database schema initialized successfully!"
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
