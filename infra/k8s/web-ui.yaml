    <div class="text-xs text-gray-500 dark:text-gray-400 font-mono">Port: 9002</div>
    </div>
    
    <div class="bg-gray-100 dark:bg-component-dark rounded-xl border border-gray-200 dark:border-border-dark p-6">
    <div class="flex items-center justify-between mb-4">
    <div class="bg-red-100 dark:bg-red-900/30 rounded-lg p-3">
    <span class="material-symbols-outlined text-red-600">rate_review</span>
    </div>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Active</span>
    </div>
    <h3 class="text-gray-900 dark:text-white text-lg font-bold mb-2">Reviewer (Gemini)</h3>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">Quality assurance</p>
