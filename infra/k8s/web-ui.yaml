    </div>
    </div>
    <button onclick="invokeTestAgent()" class="w-full px-3 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-blue-600">Invoke Now</button>
    </div>
    
    <!-- Demo Agents (will be populated) -->
    <div class="bg-gray-100 dark:bg-component-dark rounded-xl border border-gray-200 dark:border-border-dark p-6">
    <div class="flex items-center justify-between mb-4">
    <div class="bg-purple-100 dark:bg-purple-900/30 rounded-lg p-3">
    <span class="material-symbols-outlined text-purple-600">psychology</span>
    </div>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Active</span>
    </div>
    <h3 class="text-gray-900 dark:text-white text-lg font-bold mb-2">Orchestrator (GPT-4o)</h3>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">Workflow coordinator</p>
    <div class="text-xs text-gray-500 dark:text-gray-400 font-mono">Port: 9000</div>
    </div>
    
    <div class="bg-gray-100 dark:bg-component-dark rounded-xl border border-gray-200 dark:border-border-dark p-6">
    <div class="flex items-center justify-between mb-4">
    <div class="bg-green-100 dark:bg-green-900/30 rounded-lg p-3">
    <span class="material-symbols-outlined text-green-600">search</span>
    </div>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Active</span>
    </div>
    <h3 class="text-gray-900 dark:text-white text-lg font-bold mb-2">Research (Claude)</h3>
    <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">Deep research agent</p>
    <div class="text-xs text-gray-500 dark:text-gray-400 font-mono">Port: 9001</div>
    </div>
    
    <div class="bg-gray-100 dark:bg-component-dark rounded-xl border border-gray-200 dark:border-border-dark p-6">
    <div class="flex items-center justify-between mb-4">
