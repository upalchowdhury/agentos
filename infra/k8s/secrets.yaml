apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: agentos
type: Opaque
stringData:
  database-url: "postgresql://postgres:CHANGE_ME@postgres:5432/agentos"
  redis-password: "CHANGE_ME"
  issuer-private-key: '{"kty":"OKP","crv":"Ed25519","x":"CHANGE_ME"}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-config
  namespace: agentos
data:
  environment: "production"
  log-level: "info"
