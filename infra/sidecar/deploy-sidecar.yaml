# Kubernetes Deployment for Envoy Sidecar Pattern
# Demonstrates AgentOS coexistence with Flex Gateway

apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
  namespace: agentos
data:
  envoy.yaml: |
    # Envoy configuration loaded from configmap
    # See envoy-config.yaml for full configuration
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-with-sidecar
  namespace: agentos
  labels:
    app: agent-service
    telemetry: agentos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
        telemetry: agentos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: "/stats/prometheus"
    spec:
      containers:
      # Main agent container
      - name: agent
        image: agentos/runtime:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentos-secrets
              key: database-url
        - name: SERVICE_NAME
          value: "agent-runtime"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      
      # Envoy sidecar for telemetry & policy
      - name: envoy-sidecar
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 9080
          name: proxy
          protocol: TCP
        - containerPort: 9901
          name: admin
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
        command:
        - envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --service-cluster
        - agentos-sidecar
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 10
          periodSeconds: 5
      
      # OPA sidecar for policy decisions
      - name: opa
        image: openpolicyagent/opa:latest-envoy
        ports:
        - containerPort: 9191
          name: grpc
        args:
        - run
        - --server
        - --addr=0.0.0.0:8181
        - --diagnostic-addr=0.0.0.0:8282
        - --set=plugins.envoy_ext_authz_grpc.addr=:9191
        - --set=decision_logs.console=true
        - --ignore=.*
        - /policies
        volumeMounts:
        - name: opa-policies
          mountPath: /policies
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-sidecar-config
      - name: opa-policies
        configMap:
          name: opa-policies

---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: agentos
spec:
  selector:
    app: agent-service
  ports:
  - name: http
    port: 80
    targetPort: 9080  # Route through Envoy sidecar
    protocol: TCP
  - name: admin
    port: 9901
    targetPort: 9901
    protocol: TCP
  type: ClusterIP

---
# Service for direct agent access (bypassing sidecar, for internal use)
apiVersion: v1
kind: Service
metadata:
  name: agent-service-direct
  namespace: agentos
spec:
  selector:
    app: agent-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
