replicaCount: 3

image:
  repository: agentos/policy-engine
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

env:
  - name: REDIS_URL
    value: "redis://redis:6379"
  - name: RUST_LOG
    value: "info"
