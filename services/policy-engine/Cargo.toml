[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
redis = { version = "0.24", features = ["aio", "tokio-comp"] }
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
actix-rt = "2.9"
